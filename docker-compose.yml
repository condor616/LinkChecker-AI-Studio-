name: lynxscan-app

services:
  # Main Next.js Application
  app:
    image: ${DOCKER_IMAGE_APP:-lynxscan}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-lynx_scan}:${POSTGRES_PASSWORD:-localpass}@db:5432/${POSTGRES_DB:-lynx_scan}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-at-least-32-chars-long}
      - NEXTAUTH_URL=http://localhost:3001
      - APP_URL=${APP_URL:-http://localhost:3001}
      - NODE_ENV=production
      - RUN_MIGRATIONS=true
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-26}
      - SMTP_SECURE=${SMTP_SECURE:-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - MAIL_ADMIN=${MAIL_ADMIN:-}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    restart: always

  # Background Worker
  worker:
    image: ${DOCKER_IMAGE_WORKER:-lynxscan-worker}
    build:
      context: .
      dockerfile: docker/services/worker.Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-lynx_scan}:${POSTGRES_PASSWORD:-localpass}@db:5432/${POSTGRES_DB:-lynx_scan}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - BULLMQ_CONCURRENCY=${BULLMQ_CONCURRENCY:-10}
      # Always use the Compose service name inside the Docker network (ignore host localhost URL).
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    restart: always

  # Persistent Postgres Database
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lynx_scan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpass}
      POSTGRES_DB: ${POSTGRES_DB:-lynx_scan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lynx_scan} -d ${POSTGRES_DB:-lynx_scan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloudflare challenge solver (Chrome). Always started with the stack.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: unless-stopped

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5051:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@lynxscan.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/services/pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
